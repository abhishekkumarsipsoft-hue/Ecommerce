openapi: 3.0.3
info:
  title: CampusEats Orders Service
  version: 1.0.0
  description: |
    Orders service for CampusEats bags store (backpacks / laptop bags / sling bags).
    Owns cart, addresses, orders and order_items per Assignment 2 boundary (Order Service:
    Navendu, Yatindra, Shruti). Catalogue and Payments remain separate services.
    This contract is written before code (Part B). Every failure uses the Problem shape.
  contact:
    name: MCA-CS543-G07
    email: pramit.mazumdar@iiitvadodara.ac.in

servers:
  - url: http://localhost:5001
    description: Local Orders service
  - url: https://api.campuseats.example.com
    description: Production

paths:
  /api/health:
    get:
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/orders:
    post:
      summary: Create an order
      operationId: createOrder
      description: |
        Creates a PENDING_PAYMENT order from a user's cart. The request is validated
        by validate_create_order() before any store access (replaces XML Schema).
        Retry-safe via Idempotency-Key header — a repeated key returns the original
        200 without creating a duplicate (C7).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Client-generated key; same key returns original result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created order
            Idempotency-Key:
              schema:
                type: string
              description: Echoed when supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Duplicate idempotency key — original returned without redo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Malformed body (missing field, bad JSON, total mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Valid request the domain refuses (mapped from SecurePay PaymentFault card_declined/invalid_token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Payments dependency unreachable after retries (gateway_timeout)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

    get:
      summary: List orders (filtered)
      operationId: listOrders
      description: Filtered list using query string — user_id and/or status.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by owner user id
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING_PAYMENT, PAID, PACKED, SHIPPED, DELIVERED, CANCELLED]
          description: Filter by order status
      responses:
        '200':
          description: List of orders (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/orders/{orderId}:
    get:
      summary: Get a single order
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order id
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/orders/{orderId}/cancellation:
    post:
      summary: Cancel an order (sub-resource)
      operationId: cancelOrder
      description: |
        State-changing sub-resource. Returns 202 Accepted because refund continues
        asynchronously after the reply. Valid domain refusals return 422; races return 409.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
      responses:
        '202':
          description: Cancellation accepted — order is now CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Malformed cancellation body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State conflict — order already has a cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Valid request but domain refuses (e.g. already SHIPPED/DELIVERED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/orders/{orderId}/status:
    patch:
      summary: Advance order status (admin)
      operationId: updateOrderStatus
      description: Used to demonstrate 409 conflict on illegal transitions.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Illegal transition or already in that status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      description: RFC 7807 single error shape — every failure uses this
      properties:
        type:
          type: string
          format: uri
          example: https://campuseats.example.com/problems/bad-request
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "missing required field: address_id"

    OrderItem:
      type: object
      required: [product_id, product_name, unit_price, quantity]
      properties:
        product_id:
          type: string
          example: prod_backpack_001
        product_name:
          type: string
          example: Urban Daypack 25L
        unit_price:
          type: number
          format: double
          example: 899.00
        quantity:
          type: integer
          minimum: 1
          example: 2

    CreateOrderRequest:
      type: object
      required: [user_id, address_id, items, total_amount]
      properties:
        user_id:
          type: string
          example: user_abhishek_01
        address_id:
          type: string
          example: addr_12
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount:
          type: number
          format: double
          description: Must equal sum of unit_price * quantity
          example: 1798.00

    CancellationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          example: Ordered the wrong size

    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, PACKED, SHIPPED, DELIVERED, CANCELLED]
          example: PACKED

    Order:
      type: object
      required: [id, user_id, address_id, items, total_amount, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 6f8a9c1e-4b2d-4f0a-9c3e-1a2b3c4d5e6f
        user_id:
          type: string
          example: user_abhishek_01
        address_id:
          type: string
          example: addr_12
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount:
          type: number
          format: double
          example: 1798.00
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, PACKED, SHIPPED, DELIVERED, CANCELLED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        cancellation:
          type: object
          nullable: true
          properties:
            reason:
              type: string
            cancelled_at:
              type: string
              format: date-time
